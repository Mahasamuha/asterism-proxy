services:
  asterism-proxy:
    build:
      context: .
      dockerfile: packages/proxy/Dockerfile
    ports:
      - "3000:3000"
    # Deliberately no `env_file: .env`: that would hand the proxy everything in
    # .env, including POSTGRES_PASSWORD as its own variable. Each key below is
    # passed through from .env (or the shell) only if set there, so unset
    # optional settings stay unset. A new setting must be added to this list.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT:
      LOG_LEVEL:
      ISSUER_URL:
      COOKIE_SECRET:
      TRUST_PROXY:
      METRICS_TOKEN:
      SETUP_TOKEN:
      ENABLE_OIDC:
      OIDC_ISSUER:
      OIDC_CLIENT_ID:
      OIDC_CLIENT_SECRET:
      ENABLE_LOCAL_ACCOUNTS:
      ENABLE_DCR:
      ALLOW_INSECURE_CLIENT_METADATA:
      TRUST_POLICY_PATH:
      RESOURCE_SERVERS_PATH:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16.14
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
