name: CI / Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Defense-in-depth: this workflow only ever needs to read the repo (push/PR to main,
# no secrets used) — the default token permissions are broader than that.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests only: globalSetup creates this database and refuses any name not ending in _test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcp_auth_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm comes from the root package.json "packageManager" field; it must be on PATH
      # before setup-node so the pnpm cache can be enabled.
      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # generate never connects; a placeholder URL satisfies prisma.config.ts.
      - run: pnpm --filter @mcp-auth/proxy exec prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm test:integration
