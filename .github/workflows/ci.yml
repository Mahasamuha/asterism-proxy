name: CI / Tests

on:
  push:
    branches: [main]
    # Release tags publish a versioned image. 'v*' does not match the verifier's
    # asterism-verify-v* tags, which have their own workflow.
    tags: ['v*']
  pull_request:
    branches: [main]

# Defense-in-depth: this workflow only ever needs to read the repo — the default
# token permissions are broader than that. The only secret used is the org-level
# DOCKERHUB_TOKEN, and only in the image job on a push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests only: globalSetup creates this database and refuses any name not ending in _test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcp_auth_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm comes from the root package.json "packageManager" field; it must be on PATH
      # before setup-node so the pnpm cache can be enabled.
      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Fails the build on known high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level=high

      # generate never connects; a placeholder URL satisfies prisma.config.ts.
      - run: pnpm --filter @mcp-auth/proxy exec prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm test:integration

  image:
    # Only after the tests pass. Pull requests build the image to prove the
    # Dockerfile still works, but never push it.
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          # Same as Constellation's relay-publish: the org account, with the
          # org-level DOCKERHUB_TOKEN secret.
          username: mahasamuha
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main → :main and :sha-<short>; tag v1.2.3 → :1.2.3, :1.2 and :latest
      # (latest only ever comes from a release tag without a pre-release suffix,
      # never from main).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: mahasamuha/asterism-proxy
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/proxy/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
