name: Release check / asterism-verify

on:
  workflow_dispatch:
  push:
    tags: ['asterism-verify-v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @mahasamuha/asterism-verify build

      - run: pnpm --filter @mahasamuha/asterism-verify test

      # Packs the tarball, asserts its contents, installs it into a temp project, checks the
      # ESM import and types, and fails if this version is already published to npm.
      - run: node scripts/check-verify-package.mjs
