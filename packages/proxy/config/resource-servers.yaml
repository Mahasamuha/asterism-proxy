# Resource server registry (§2/T2). Static config, not the database — each MCP
# server this proxy issues tokens for must be listed here with its scope
# vocabulary. See PLAN.md §2 for the example shape and M1 for onboarding
# Constellation.
#
# Optional per-server and per-scope settings (example):
#
#   resourceServers:
#     - identifier: https://mcp.example.com
#       name: Example MCP
#       # Upstream identity claims copied, when present, into the top level of
#       # this server's access tokens (names after OIDC_CLAIM_MAP is applied).
#       # Protocol claims (iss sub aud exp nbf iat jti client_id scope cnf act
#       # azp nonce auth_time) are rejected. email_verified may be false
#       # upstream, so never authorize by email.
#       releaseClaims: [email, groups, constellation_username]
#       scopes:
#         - name: read
#           description: Read things
#         - name: admin
#           description: Administer
#           shortLived: true
#           # Any-of: only users whose `groups` claim contains one of these may
#           # be issued the scope; others get invalid_scope at consent.
#           requireGroups: [constellation-admins]
resourceServers: []
